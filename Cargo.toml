[package]
name = "chiron"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0"
axum = "0.7"
tokio = { version = "1.0", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
candle-core = "0.4.0"
candle-transformers = "0.4.0"
tokenizers = "0.15.0"
sysinfo = "0.30"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }

# Opcional: para suporte a GGUF via Candle.
# Descomente se quiser usar o caminho GGUF.
# candelabra = "0.1"

[profile.release]
opt-level = 1
lto = false
codegen-units = 16